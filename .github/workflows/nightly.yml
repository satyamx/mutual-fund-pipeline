name: nightly-refresh

# Roadmap #7: scheduler + throttle + incremental NAV refresh, at $0 on GitHub-hosted
# runners. Refreshes NAV for the tracked universe, re-emits the app artifact, and
# appends + commits the (git-tracked, unbackfillable) prediction ledger.
#
# THROTTLE: there is no sleep loop. mf_cache/ is persisted between runs via
# actions/cache, and the data adapters are cache-first with a 20h TTL — so a warm
# cache means bootstrap only refetches NAV that is actually stale. That IS the
# politeness mechanism for the free, no-key APIs (AMFI / mfapi.in / yfinance).
#
# COLD-CACHE NOTE: the universe manifest is hand-curated and GIT-TRACKED
# (overrides/universe_manifest.csv), so `bootstrap.py --from-manifest` works on a
# cold runner straight off the checkout. The cohort model artifact is still
# GENERATED, not committed (mf_cache/ is gitignored and evictable) — seed it once
# locally (`python mf_model.py --stage cohort`) and let the first run populate the
# actions/cache; steps needing it degrade honestly until then rather than fabricating.

on:
  # ENABLED 2026-08-03, after run 30775066004 went green on 136/136 funds with 0
  # errors. The two runs before it are worth remembering: the first failed on an
  # unpushed manifest fix, and the second reported SUCCESS while silently dropping
  # 118 of 136 funds — which is why the emit step now carries --max-error-rate.
  schedule:
    - cron: "30 20 * * *"   # 20:30 UTC ≈ 02:00 IST, after AMFI's evening NAV publish
  workflow_dispatch: {}

permissions:
  contents: write        # commit the appended prediction ledger back to the repo

concurrency:
  group: nightly-refresh
  cancel-in-progress: false     # never interrupt a run mid-ledger-append

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8          # ₹/emoji output crashes under cp1252 otherwise
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Evolving-cache pattern: the run_id key never hits, so restore-keys pulls the
      # most recent cache and a fresh one is always saved post-job (persisting NAV,
      # models, manifest, and the emitted artifact for the next night).
      - name: Restore generated data cache
        uses: actions/cache@v4
        with:
          path: mf_cache
          key: mf-cache-${{ github.run_id }}
          restore-keys: |
            mf-cache-

      - name: Sanity gate — pure selftests (no data needed)
        run: |
          python mf_holdings.py --selftest
          python mf_eval.py --selftest

      - name: Refresh AMFI master + NAV for the tracked universe
        run: python bootstrap.py --from-manifest

      # TWO different conditions, previously conflated into one — which broke run
      # 30844252641. The shipped model is git-tracked (model/), so its absence is a
      # real defect and hard-fails: without it the batch emits no signal at all, and
      # a signal-less artifact still looks like a successful run. The selftests below
      # are a separate matter — they REPLAY the training parquets to prove numpy
      # inference reproduces sklearn, and those parquets are regenerable research
      # outputs that legitimately are not on a cold runner. Skipping them there is
      # correct; skipping them silently forever (the pre-2026-08-03 behaviour, which
      # still pointed at the old model path) is not, hence the explicit notice.
      - name: Model-layer selftests
        run: |
          if [ ! -f model/model_artifact_cohort.json ]; then
            echo "::error::model/model_artifact_cohort.json is missing from the checkout"
            exit 1
          fi
          if [ -f mf_cache/phase_b/features.parquet ] && [ -f mf_cache/phase_b/labels.parquet ]; then
            python mf_features.py --selftest
            python mf_infer.py --selftest
            python mf_ledger.py --selftest
          else
            echo "::notice::training parquets absent (cold cache) — skipped the selftests that replay them. The shipped model is committed and still scores."
          fi

      # --max-error-rate makes "green" mean something. The first real run (2026-08-03,
      # 30773638867 -> 30774345802) emitted 18 of 136 funds and still reported success,
      # because a per-fund drop is by design not fatal to the batch. A quarter of the
      # universe failing is a broken run, not a thin one; the artifact is still written
      # and uploaded (below, if: always()) so the failure is diagnosable.
      # --max-anchor-age-days catches the OTHER way a run can be green and useless.
      # Until 2026-08-06 the orchestrator's TODAY was hardcoded to 2026-07-13, so
      # every scoring anchor was pinned to that date: the nightly refreshed NAV for
      # 14 minutes, re-scored one historical anchor, deduped against rows that
      # already existed, appended NOTHING, and reported success — every single
      # night. TODAY now tracks the real date, and this gate makes a relapse fail
      # loudly. 7 days tolerates a weekend plus a couple of missed runs; it does NOT
      # fire on an ordinary same-day re-run, which legitimately appends zero rows.
      - name: Emit batch artifact (+ append prediction ledger)
        run: python mf_artifact.py --max-error-rate 0.25 --max-anchor-age-days 7

      - name: Commit the prediction ledger (git-tracked, unbackfillable)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain ledger/)" ]; then
            echo "no new ledger rows to commit"; exit 0
          fi
          git add ledger/
          git commit -m "nightly: append prediction ledger $(date -u +%F) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "push attempt $i failed; retrying"; sleep $((i * 5))
          done

      # mf_cache/ is gitignored, so the app-facing artifact also ships as a build
      # artifact — auth-gated, but it is the 30-day HISTORY the rolling Release below
      # deliberately does not keep. if: always() so a run that failed a gate is still
      # diagnosable; note this uploads every artifact in the restored cache dir, not
      # just this run's, which is why the Release step selects the newest explicitly.
      - name: Upload the app artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mf-artifact-${{ github.run_id }}
          path: mf_cache/artifacts/*.json.gz
          if-no-files-found: warn
          retention-days: 30

      # THE APP-FACING URL. A build artifact's download link is per-run and auth-gated,
      # so the app can never fetch one unattended. A Release asset on a rolling tag is a
      # URL that does not move:
      #   https://github.com/<owner>/<repo>/releases/download/latest-artifact/mf_artifact_latest.json.gz
      #
      # STABLE IS NOT THE SAME AS PUBLIC, and this repo is private: that link 404s for an
      # anonymous client and only becomes fetchable if the repo goes public (or the asset
      # is mirrored somewhere public). Publishing here is still right — it is the
      # canonical store, and it needs no change whichever way that call goes — but the
      # app integration is NOT unblocked by this step alone. See docs/ci.md.
      #
      # Three deliberate choices:
      #  - NOT `if: always()`. This step runs only if the emit step exited 0, so a batch
      #    that tripped --max-error-rate or --max-anchor-age-days can never overwrite a
      #    good artifact at the URL the app trusts. A stale-but-valid artifact beats a
      #    fresh broken one; the failed run is still inspectable as the build artifact.
      #  - STABLE ASSET NAME. mf_artifact.py stamps its filename with a timestamp, which
      #    would move the URL every night. The asset is renamed to a fixed name and the
      #    real generated_at/model_id live INSIDE the payload, where the app already reads
      #    them. Selected by mtime (`ls -t`), not by glob order: mf_cache/artifacts/ is
      #    restored from actions/cache and holds every previous run's output too.
      #  - `latest.json` SIDECAR so the app can check freshness without pulling the gz.
      #    Derived from the artifact itself (never hand-maintained) and carries the
      #    sha256 of the exact asset published beside it.
      #  - DEFAULT BRANCH ONLY. A workflow_dispatch from a test branch must not be able
      #    to overwrite the URL the app trusts. success() is spelled out rather than
      #    left implicit, so the gate is not resting on an Actions subtlety.
      #
      # gh is preinstalled on GitHub-hosted runners and authenticates with the built-in
      # GITHUB_TOKEN — no third-party action and no secret, matching the rest of this
      # workflow. `contents: write` (declared above) is what permits the release edit.
      - name: Publish the artifact to the rolling Release
        if: success() && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: latest-artifact
        run: |
          set -euo pipefail
          SRC="$(ls -t mf_cache/artifacts/*.json.gz 2>/dev/null | head -1 || true)"
          if [ -z "${SRC:-}" ]; then
            echo "::error::no artifact to publish — the emit step wrote nothing"
            exit 1
          fi
          echo "publishing $SRC"
          mkdir -p dist
          cp "$SRC" dist/mf_artifact_latest.json.gz

          # The sidecar is READ OUT of the artifact, so it can never disagree with it.
          python - <<'PY'
          import gzip, hashlib, json, pathlib
          asset = pathlib.Path("dist/mf_artifact_latest.json.gz")
          art = json.loads(gzip.decompress(asset.read_bytes()))
          cov = art.get("coverage") or {}
          pathlib.Path("dist/latest.json").write_text(json.dumps({
              "artifact_version": art.get("artifact_version"),
              "generated_at":     art.get("generated_at"),
              "model_id":         art.get("model_id"),
              "pipeline_sha":     art.get("pipeline_sha"),
              "n_funds":          cov.get("n_ok"),
              "n_errors":         cov.get("n_errors"),
              "asset":            asset.name,
              "sha256":           hashlib.sha256(asset.read_bytes()).hexdigest(),
              "size_bytes":       asset.stat().st_size,
          }, indent=2) + "\n")
          print(pathlib.Path("dist/latest.json").read_text())
          PY

          # Create the release once; every later run just replaces the two assets on it.
          # --clobber is what makes the tag "rolling" — same URL, new bytes.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Latest batch artifact" \
              --notes "Rolling pointer to the newest nightly batch artifact. Assets are replaced in place, so the download URLs are stable; the payload's own generated_at / model_id identify the run. Per-run history lives in the 30-day build artifacts." \
              --latest=false
          fi
          gh release upload "$TAG" \
            dist/mf_artifact_latest.json.gz \
            dist/latest.json \
            --clobber
